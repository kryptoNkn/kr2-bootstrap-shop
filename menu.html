<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Меню — SIP Coffee</title>
  <link rel="icon" type="image/png" href="public/images/logoblack.png">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@0.9.4/css/bulma.min.css">
  <link rel="stylesheet" href="css/custom.css">
</head>
<body data-page="menu">
  <header class="header">
    <div class="header-inner">
      <a href="index.html" class="logo-link"><img src="public/images/logo.png" alt="SIP Coffee" class="logo-img"></a>
      <nav class="nav">
        <a href="index.html">Главная</a>
        <a href="menu.html" class="active">Меню</a>
        <a href="contacts.html">Контакты</a>
      </nav>
      <div class="header-actions">
        <a href="tel:+79587512149" class="phone"><span>+7 (958) 751-21-49</span></a>
        <div class="rating-badge"><svg class="star" width="14" height="14" viewBox="0 0 24 24"><path d="M12 2l2.9 6.6L22 9.2l-5 4.6L18.2 21 12 17.6 5.8 21 7 13.8 2 9.2l7.1-.6z"/></svg><span>5.0</span></div>
        <a href="cart.html" class="cart-link">Корзина <span class="cart-count" data-cart-count>0</span></a>
        <button class="nav-toggle" type="button" data-bs-toggle="collapse" data-bs-target="#mobileNav" aria-label="Меню">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
        </button>
      </div>
    </div>
    <div class="collapse" id="mobileNav">
      <nav class="mobile-nav">
        <a href="index.html">Главная</a><a href="menu.html">Меню</a><a href="contacts.html">Контакты</a><a href="cart.html">Корзина</a>
      </nav>
    </div>
  </header>
  <main>
    <div class="page-hero center">
      <h1 class="section-title">Меню</h1>
      <p class="subtitle">Качественные ингредиенты и любовь к кофе</p>
    </div>
    <section class="section" style="margin-top:2.5rem">
      <div class="filters">
        <button class="btn-ghost active" type="button" data-filter="all">Все</button>
        <button class="btn-ghost" type="button" data-filter="coffee">Кофе</button>
        <button class="btn-ghost" type="button" data-filter="tea">Чай</button>
        <button class="btn-ghost special" type="button" data-filter="cold">Холодные напитки</button>
        <button class="btn-ghost" type="button" data-filter="dessert">Десерты</button>
      </div>
      <div class="cards-products" id="menuGrid"></div>
    </section>
  </main>
  <footer class="footer">
    <div class="footer-inner">
      <img src="public/images/logo.png" alt="SIP Coffee" class="logo-img">
      <div class="legal">Москва, Газетный переулок, 3 · +7 (958) 751-21-49</div>
      <div class="copyright">© WaterMelonStudios 2026. Артемов А.С. ЭФБО-11-25</div>
    </div>
  </footer>
  <div class="modal fade" id="optModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header"><h5 class="modal-title" id="optTitle"></h5><button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Закрыть"></button></div>
        <div class="modal-body">
          <p class="muted" id="optDesc"></p>
          <p class="label" style="margin-top:1rem">Размер</p>
          <div class="options" id="optSizes"></div>
          <p class="label" style="margin-top:1rem">Дополнительно</p>
          <div class="options" id="optExtras"></div>
        </div>
        <div class="modal-footer"><span class="price" id="optPrice"></span><button class="btn-dark" style="width:auto" type="button" id="optConfirm">Добавить</button></div>
      </div>
    </div>
  </div>
  <div class="toast-container position-fixed bottom-0 end-0 p-3">
    <div id="cartToast" class="toast" role="status" data-bs-delay="2200"><div class="toast-body"></div></div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
